name: awdf-task-management

services:
  # ── 1. Database Service (MongoDB) ──────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: awdf-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taskdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - awdf-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. Backend REST API Service (Node.js + Express) ──────────────────────
  backend:
    build:
      context: ./student-backend
      dockerfile: Dockerfile
    container_name: awdf-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DOCKER_ENV: "true"
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: f8a3b7c9d2e1f4a6b8c0d3e5f7a9b1c3d5e7f9a2b4c6d8e0f1a3b5c7d9e1f3
      JWT_EXPIRES_IN: 24h
    ports:
      - "3000:3000"
    volumes:
      - backend_exports:/usr/src/app/exports
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - awdf-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 3. Frontend Web Client Service (React + Vite + Nginx) ─────────────────
  frontend:
    build:
      context: ./Student-portfolio
      dockerfile: Dockerfile
    container_name: awdf-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - awdf-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

# ── Isolated Bridge Network ──────────────────────────────────────────────────
networks:
  awdf-network:
    name: awdf-network
    driver: bridge

# ── Persistent Storage Volumes ───────────────────────────────────────────────
volumes:
  mongodb_data:
    name: awdf_mongodb_data
  backend_exports:
    name: awdf_backend_exports
